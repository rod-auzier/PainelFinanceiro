<!doctype html>
<!--
  HTML base servido pelo Vite. O bundle React é injetado a partir de
  /src/main.jsx e montado na div #root.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Cor da barra do navegador no celular = fundo do app (--color-bg em src/index.css).
         Meta tags não leem CSS variables: se mudar o fundo lá, mude aqui e no manifest.json. -->
    <meta name="theme-color" content="#0A0C0F" />
    <meta name="color-scheme" content="dark" />
    <title>Painel Financeiro Pessoal</title>

    <!--
      ÍCONES (arquivos em client/public/, servidos na raiz do site):
      - favicon-32.png / favicon-16.png → ícone da aba do navegador
      - apple-touch-icon.png            → ícone ao "Adicionar à Tela de Início" no iOS
      - icon-192.png / icon-512.png     → ícones do app instalável (PWA); são
                                           referenciados em /manifest.json, não aqui
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Web App Manifest: nome, ícones (192/512) e cores do app instalável. -->
    <link rel="manifest" href="/manifest.json" />

    <!--
      Fontes (Google Fonts):
      - Inter        → textos e labels da interface (font-sans no Tailwind)
      - JetBrains Mono → valores monetários e números (font-mono + tabular-nums)
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
